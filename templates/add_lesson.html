<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8">
    <title>Добави Урок</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-0 p-4">
                    <h3 class="mb-4 text-center">Публикувай нов урок</h3>
                    <form action="/create-lesson" method="post">
                        <div class="mb-3">
                            <label class="form-label">Предмет / Услуга:</label>
                            <input type="text" name="subject" class="form-control" placeholder="напр. Английски език"
                                required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Категория:</label>
                            <select name="category" class="form-select">
                                <option value="Частни уроци">Частни уроци</option>
                                <option value="Музика">Музика</option>
                                <option value="Спорт">Спорт</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Цена (лв.):</label>
                            <input type="number" step="0.01" name="price" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Публикувай</button>
                        <a href="/profile" class="btn btn-link w-100 mt-2">Отказ</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
