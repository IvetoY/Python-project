<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Вход - Услуги Наблизо</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">📍 Услуги Наблизо</a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow-sm border-0 p-4">
                    <h2 class="text-center mb-4 text-primary">Вход</h2>
                    <form action="/login-web" method="post">
                        <div class="mb-3">
                            <label class="form-label text-muted">Имейл</label>
                            <input type="email" name="email" class="form-control" placeholder="example@mail.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted">Парола</label>
                            <input type="password" name="password" class="form-control" placeholder="******" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">Влез в профила</button>
                    </form>
                    <hr class="text-muted">
                    <p class="text-center mb-0">Нямате профил? <a href="/register" class="text-primary text-decoration-none">Регистрирайте се</a></p>
                    <div class="text-center mt-2"><a href="/" class="small text-secondary">Върни се в началото</a></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
