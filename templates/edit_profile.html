<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Редактирай Профил - Услуги Наблизо</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm p-4 border-0">
                    <h3 class="text-primary mb-4">Редактиране на данни</h3>
                    <form action="/update-profile" method="post">
                        <div class="mb-3">
                            <label class="form-label text-muted">Име</label>
                            <input type="text" name="first_name" class="form-control" value="{{ user.first_name or '' }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted">Телефон</label>
                            <input type="text" name="phone" class="form-control" value="{{ user.phone or '' }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted">Адрес</label>
                            <input type="text" name="address" class="form-control" value="{{ user.address or '' }}">
                        </div>
                        {% if user.role == 'tutor' %}
                        <div class="mb-3">
                            <label class="form-label text-muted">Биография (за учители)</label>
                            <textarea name="bio" class="form-control" rows="3">{{ user.bio or '' }}</textarea>
                        </div>
                        {% endif %}
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary flex-grow-1">Запази промените</button>
                            <a href="/profile" class="btn btn-outline-secondary">Отказ</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
